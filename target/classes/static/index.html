<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>US18 Quản lý tài khoản</title><style>body{font:15px Arial;max-width:760px;margin:40px auto;background:#f4f6f8}main{background:#fff;padding:24px;border-radius:10px}input,select,button{display:block;width:100%;box-sizing:border-box;padding:10px;margin:8px 0}button{background:#1769aa;color:#fff;border:0}pre{white-space:pre-wrap}</style></head><body><main><h1>US18 Quản lý tài khoản</h1><input id="admin" placeholder="ID tài khoản Admin đang đăng nhập"><input id="name" placeholder="Họ tên"><input id="email" type="email" placeholder="Email"><input id="phone" placeholder="Số điện thoại"><input id="password" type="password" placeholder="Mật khẩu tối thiểu 8 ký tự"><select id="role"><option value="">Chọn vai trò</option><option value="ADMIN">Admin</option><option value="PM">PM</option><option value="MEMBER">Member</option></select><input id="department" placeholder="Mã phòng ban từ database"><button onclick="save()">Tạo tài khoản</button><pre id="out"></pre></main><script>async function save(){let r=await fetch('/api/users',{method:'POST',headers:{'Content-Type':'application/json','X-Admin-Id':admin.value},body:JSON.stringify({fullName:name.value,email:email.value,phone:phone.value,password:password.value,roleId:role.value,departmentId:department.value||null})});out.textContent=await r.text()}</script></body></html>
