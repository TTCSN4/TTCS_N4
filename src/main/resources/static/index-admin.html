  <style>

    .brand{display:flex;align-items:center;gap:12px;padding:3px 7px 31px}.brand-mark{display:grid;width:43px;height:43px;place-items:center;border-radius:13px;color:#fff;background:var(--blue);font-size:20px;font-weight:800}.brand-title{font-size:16px;font-weight:750}.brand-sub{margin-top:3px;color:#aab6ca;font-size:11px}.nav-caption{margin:0 10px 10px;color:#8f9eb8;font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase}.nav-list{display:grid;gap:6px}.nav-link{display:flex;min-height:44px;align-items:center;gap:12px;padding:0 12px;border:0;border-radius:9px;color:#c6cfde;background:transparent;text-align:left;text-decoration:none}.nav-link:hover,.nav-link.active{color:#fff;background:#2b3f63}.nav-link.active{box-shadow:inset 3px 0 #71a4ff}.nav-icon{display:grid;width:20px;height:20px;place-items:center}.nav-icon svg,.icon svg,.icon-button svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-linecap:round;stroke-linejoin:round;stroke-width:1.8}.nav-group-toggle{width:100%;list-style:none}.nav-group-toggle::-webkit-details-marker{display:none}.chevron{width:17px;height:17px;margin-left:auto;fill:none;stroke:currentColor;stroke-width:2;transition:transform .18s}.nav-group[open] .chevron{transform:rotate(180deg)}.nav-submenu{display:grid;gap:3px;padding:3px 0 4px 42px}.nav-submenu .nav-link{min-height:34px;padding:0 9px;font-size:12px}.nav-submenu .nav-link.active{box-shadow:inset 2px 0 #71a4ff}.profile{display:flex;align-items:center;gap:10px;margin-top:auto;padding:16px 8px 3px;border-top:1px solid #ffffff20}.avatar{display:grid;width:34px;height:34px;place-items:center;border-radius:50%;color:#24447c;background:#e8efff;font-size:11px;font-weight:750}.name{font-size:12px;font-weight:700}.role{margin-top:3px;color:#9eabc0;font-size:10px}
    .main{min-height:100vh;margin-left:250px}.topbar{position:sticky;top:0;z-index:3;display:flex;height:68px;align-items:center;justify-content:space-between;padding:0 28px;border-bottom:1px solid var(--line);background:#ffffffed;backdrop-filter:blur(12px)}.search{display:flex;width:min(620px,72%);height:40px;align-items:center;gap:10px;padding:0 13px;border:1px solid #eceef3;border-radius:9px;color:#929bab;background:#f8f9fb}.search input{width:100%;border:0;outline:0;background:transparent;font-size:13px}.content{max-width:1640px;margin:auto;padding:27px 28px 44px}.heading{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:22px}.heading-main{display:flex;align-items:center;gap:13px}.heading-icon{display:grid;width:45px;height:45px;place-items:center;border-radius:12px;color:var(--blue);background:#e9f0ff}.heading-icon svg,.button svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-linecap:round;stroke-linejoin:round;stroke-width:1.8}h1{margin:0;font-size:22px;font-weight:740}.subtitle{margin:4px 0 0;color:var(--muted);font-size:13px}.button{display:inline-flex;min-height:39px;align-items:center;justify-content:center;gap:8px;padding:0 14px;border:1px solid #dfe4ec;border-radius:8px;color:#41516a;background:#fff;font-size:12px;font-weight:650}.button-primary{border-color:var(--blue);color:#fff;background:var(--blue)}.button-primary:hover{background:#2458c4}.button-danger{border-color:#f0d2d0;color:var(--red)}.button-small{min-height:32px;padding:0 10px;font-size:11px}.panel{border:1px solid #e9ebf0;border-radius:11px;background:#fff;box-shadow:0 5px 18px #26365008}.pad{padding:20px}.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px;margin-bottom:17px}.stat{display:flex;align-items:center;gap:12px;padding:15px 17px}.stat-icon{display:grid;width:39px;height:39px;flex:0 0 auto;place-items:center;border-radius:10px;color:var(--blue);background:#edf3ff}.stat-icon.green{color:var(--green);background:var(--green-bg)}.stat-icon.amber{color:var(--amber);background:var(--amber-bg)}.stat-icon svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-linecap:round;stroke-linejoin:round;stroke-width:1.8}.stat-value{font-size:18px;font-weight:750}.stat-label{margin-top:3px;color:var(--muted);font-size:10px}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:15px}.toolbar-group{display:flex;flex-wrap:wrap;gap:9px}.control{width:auto;min-width:145px;min-height:37px;padding:8px 11px;border:1px solid #d9dde5;border-radius:8px;outline:none;color:#202939;background:#fff;font-size:12px}.control:focus{border-color:#7ba0f1;box-shadow:0 0 0 3px #3169dc18}.search-control{position:relative;width:min(290px,100%)}.search-control svg{position:absolute;top:10px;left:11px;width:17px;height:17px;fill:none;stroke:#929baa;stroke-width:1.8}.search-control input{width:100%;padding-left:35px}.section-title{margin:0;font-size:14px;font-weight:730}.section-caption{margin-top:4px;color:var(--muted);font-size:11px}.summary{color:var(--muted);font-size:11px}.summary strong{color:#202939;font-size:14px}.table-wrap{overflow-x:auto}table{width:100%;border-collapse:collapse;text-align:left}th{padding:11px 12px;border-bottom:1px solid var(--line);color:#838c9b;background:#fafbfc;font-size:10px;font-weight:700;white-space:nowrap}td{padding:14px 12px;border-bottom:1px solid #eef0f4;color:#475265;font-size:11px;vertical-align:middle}tr:last-child td{border-bottom:0}.item-name{color:#293447;font-size:12px;font-weight:680}.item-sub{margin-top:4px;color:#8791a1;font-size:10px}.quantity{display:flex;min-width:115px;align-items:center;gap:9px}.track{width:62px;height:6px;overflow:hidden;border-radius:99px;background:#edf0f4}.fill{height:100%;border-radius:inherit;background:#51ad82}.status{display:inline-flex;min-height:25px;align-items:center;padding:0 9px;border:0;border-radius:99px;white-space:nowrap;font-size:10px;font-weight:650}.status-ready{color:var(--green);background:var(--green-bg)}.status-maintenance{color:var(--amber);background:var(--amber-bg)}.actions{display:flex;justify-content:flex-end;gap:6px}.icon-button{display:grid;width:34px;height:34px;place-items:center;border:1px solid transparent;border-radius:8px;color:#606c7d;background:transparent}.icon-button:hover{border-color:var(--line);background:#f7f8fb}.empty{padding:42px 18px;color:#828c9a;text-align:center;font-size:12px}.empty strong{display:block;margin-bottom:6px;color:#455166;font-size:14px}
    .backdrop{position:fixed;inset:0;z-index:10;display:grid;place-items:center;padding:18px;background:#17243b70}.modal{width:min(480px,100%);padding:22px;border:1px solid #e8ebf0;border-radius:12px;background:#fff;box-shadow:0 24px 70px #18243a38}.modal h2{margin:0;font-size:18px}.copy{margin:8px 0 18px;color:var(--muted);font-size:12px;line-height:1.55}.form{display:grid;gap:13px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:grid;gap:7px}.field label{color:#424d5e;font-size:12px;font-weight:650}.field .control{width:100%}.modal-actions{display:flex;justify-content:flex-end;gap:8px;padding-top:13px;margin-top:4px;border-top:1px solid var(--line)}.toast{position:fixed;right:23px;bottom:22px;z-index:15;padding:12px 16px;border:1px solid #cdebd9;border-radius:9px;color:#286b4a;background:#f1fbf5;box-shadow:0 10px 30px #1f4b311a;font-size:12px}.toast.error{border-color:#f1cecc;color:#9e4141;background:#fff5f4}.sr{position:absolute;left:0;top:0;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
    @media(max-width:1000px){.sidebar{width:214px}.main{margin-left:214px}.content{padding-right:19px;padding-left:19px}.topbar{padding-right:19px;padding-left:19px}.stat{padding:12px}}
    @media(max-width:760px){.sidebar{position:sticky;inset:auto;width:100%;height:auto;padding:10px 12px 8px}.brand{padding:0 4px 10px}.brand-mark{width:36px;height:36px;font-size:17px}.brand-sub,.nav-caption,.profile{display:none}.nav-list{display:flex;gap:5px;overflow:visible}.nav-group{position:relative;flex:0 0 auto}.nav-submenu{position:absolute;top:100%;left:0;z-index:5;width:175px;padding:6px;background:var(--navy);border-radius:0 0 8px 8px}.nav-link{min-height:38px;flex:0 0 auto;gap:7px;padding:0 10px;font-size:11px}.nav-link.active{box-shadow:inset 0 -2px #71a4ff}.nav-icon{display:none}.main{margin:0}.topbar{height:57px;padding:0 14px}.content{padding:20px 14px 32px}.heading{align-items:flex-start}h1{font-size:19px}.stats{grid-template-columns:1fr;gap:8px}.stat{min-height:64px}.pad{padding:15px}.toolbar{align-items:flex-start;flex-direction:column}.toolbar-group,.search-control{width:100%}.toolbar-group .control{flex:1;min-width:0}}
    @media(max-width:480px){.heading{flex-direction:column}.form-grid{grid-template-columns:1fr}.table-wrap{margin:0 -15px;padding:0 15px}td,th{padding:10px 9px}}
    .nav-group[open] .chevron{transform:none}
    @media(max-width:760px){.nav-group{position:relative;flex:0 0 auto}.nav-submenu{position:absolute;top:100%;left:0;z-index:5;width:175px;padding:6px;background:var(--navy);border-radius:0 0 8px 8px}}
  </style>
</head>
<body>
  <svg class="sr" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
    <symbol id="calendar" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18M8 14h3M8 17h6"/></symbol>
    <symbol id="box" viewBox="0 0 24 24"><path d="m12 3 9 5-9 5-9-5 9-5ZM3 8v9l9 5 9-5V8M12 13v9"/></symbol>
    <symbol id="check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></symbol>
    <symbol id="plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="search" viewBox="0 0 24 24"><circle cx="10.8" cy="10.8" r="6.8"/><path d="m16 16 4.5 4.5"/></symbol>
    <symbol id="edit" viewBox="0 0 24 24"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L8 18l-4 1 1-4Z"/></symbol>
    <symbol id="trash" viewBox="0 0 24 24"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6M10 11v5M14 11v5"/></symbol>
    <symbol id="bell" viewBox="0 0 24 24"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4"/></symbol>
  </svg>
  <aside class="sidebar">
    <div class="brand"><div class="brand-mark">M</div><div><div class="brand-title">Meeting</div><div class="brand-sub">Meeting Management</div></div></div>
    <div class="nav-caption">Không gian làm việc</div>
    <nav class="nav-list" aria-label="Điều hướng chính">
      <div class="nav-link active"><span class="nav-icon"><svg><use href="#box"/></svg></span>Quản lý thiết bị</div>
    </nav>
    <div class="profile"><div class="avatar">AD</div><div><div class="name">Quản trị viên</div><div class="role">Quản lý hệ thống</div></div></div>
  </aside>
  <main class="main">
    <header class="topbar"><label class="search"><svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8"><use href="#search"/></svg><input id="global-search" type="search" placeholder="Tìm tên thiết bị, danh mục..." aria-label="Tìm kiếm thiết bị"></label><button class="icon-button" aria-label="Thông báo"><svg><use href="#bell"/></svg></button></header>
    <div class="content" id="content"></div>
  </main>
  <div id="overlay"></div><div id="toast" aria-live="polite"></div>
  <script>
    const API="http://localhost:8080/api/equipment",CACHE_KEY="meeting-equipment-v1";
    const content=document.querySelector("#content"),overlay=document.querySelector("#overlay"),toast=document.querySelector("#toast");
    let items=[];
    let query="",category="all",status="all";
    const esc=value=>String(value).replace(/[&<>"']/g,char=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[char]);
    const icon=name=>`<svg aria-hidden="true"><use href="#${name}"/></svg>`;
    async function request(path="",options={}){const response=await fetch(`${API}${path}`,{...options,headers:{"Content-Type":"application/json",...options.headers}});if(!response.ok){const detail=await response.text();throw new Error(detail||`HTTP ${response.status}`)}if(response.status===204)return null;const text=await response.text();return text?JSON.parse(text):null}
    function normalize(item){item=item?.data??item??{};return{id:item.id??item.equipmentId,name:item.name??item.equipmentName??"",category:item.category??item.type??"Khác",location:item.location??item.position??"",total:Number(item.total??item.quantity??item.totalQuantity??0),available:Number(item.available??item.availableQuantity??item.quantityAvailable??0),status:item.status??(item.maintenance?"maintenance":"ready"),booked:isBooked(item.booked??item.isBooked)}}
    function isBooked(result){if(typeof result==="boolean")return result;if(typeof result==="string")return result.toLowerCase()==="true";if(typeof result==="number")return result!==0;if(result&&typeof result==="object")return isBooked(result.booked??result.isBooked??result.data);return false}
    function unwrap(data){const list=Array.isArray(data)?data:data?.items??data?.content??data?.data??[];return Array.isArray(list)?list.map(normalize):[]}
    function payload(item){return{name:item.name,category:item.category,location:item.location,total:item.total,available:item.available,status:item.status}}
    async function refresh(){items=unwrap(await request());const bookings=await Promise.all(items.map(async item=>{try{item.booked=isBooked(await request(`/${encodeURIComponent(item.id)}/booked`))}catch{item.booked=false}return item}));items=bookings;try{localStorage.setItem(CACHE_KEY,JSON.stringify(items))}catch{}render()}
    function showError(error){notify(`Không thể kết nối API thiết bị: ${error.message}`,true)}
    function notify(text,isError=false){toast.innerHTML=`<div class="toast ${isError?"error":""}" role="status">${esc(text)}</div>`;clearTimeout(notify.timer);notify.timer=setTimeout(()=>toast.innerHTML="",3200)}
    function render(){
      const filtered=items.filter(item=>`${item.name} ${item.category} ${item.location}`.toLocaleLowerCase("vi").includes(query.toLocaleLowerCase("vi"))&&(category==="all"||item.category===category)&&(status==="all"||item.status===status));
      const quantity=items.reduce((sum,item)=>sum+item.total,0),available=items.reduce((sum,item)=>sum+item.available,0),maintenance=items.filter(item=>item.status==="maintenance").length;
      const categories=[...new Set(items.map(item=>item.category))];
      content.innerHTML=`
        <div class="heading"><div class="heading-main"><div class="heading-icon">${icon("box")}</div><div><h1>Quản lý thiết bị</h1><p class="subtitle">Cập nhật danh mục và tình trạng thiết bị sử dụng trong các phòng họp.</p></div></div><button class="button button-primary" id="add">${icon("plus")} Thêm thiết bị</button></div>
        <div class="stats"><div class="panel stat"><div class="stat-icon">${icon("box")}</div><div><div class="stat-value">${items.length}</div><div class="stat-label">Loại thiết bị</div></div></div><div class="panel stat"><div class="stat-icon green">${icon("check")}</div><div><div class="stat-value">${available} / ${quantity}</div><div class="stat-label">Đang sẵn sàng sử dụng</div></div></div><div class="panel stat"><div class="stat-icon amber">${icon("box")}</div><div><div class="stat-value">${maintenance}</div><div class="stat-label">Đang bảo trì</div></div></div></div>
        <section class="panel pad"><div class="toolbar"><div class="toolbar-group"><select class="control" id="category-filter" aria-label="Lọc danh mục"><option value="all">Tất cả danh mục</option>${categories.map(value=>`<option value="${esc(value)}" ${category===value?"selected":""}>${esc(value)}</option>`).join("")}</select><select class="control" id="status-filter" aria-label="Lọc trạng thái"><option value="all">Mọi trạng thái</option><option value="ready" ${status==="ready"?"selected":""}>Sẵn sàng</option><option value="maintenance" ${status==="maintenance"?"selected":""}>Bảo trì</option></select></div><label class="search-control">${icon("search")}<input class="control" id="search" type="search" value="${esc(query)}" placeholder="Tìm tên thiết bị..." aria-label="Tìm tên thiết bị"></label></div>
          <div class="toolbar"><div><h2 class="section-title">Danh sách thiết bị</h2><div class="section-caption">Thay đổi tại đây sẽ được phản ánh ngay trên trang đặt phòng.</div></div><div class="summary"><strong>${filtered.length}</strong> kết quả</div></div>
          ${filtered.length?`<div class="table-wrap"><table><thead><tr><th>THIẾT BỊ</th><th>DANH MỤC</th><th>SỐ LƯỢNG SẴN CÓ</th><th>VỊ TRÍ</th><th>TRẠNG THÁI</th><th><span class="sr">Thao tác</span></th></tr></thead><tbody>${filtered.map(row).join("")}</tbody></table></div>`:`<div class="empty"><strong>Chưa có thiết bị phù hợp</strong>Điều chỉnh bộ lọc hoặc thêm thiết bị vào danh mục.</div>`}
        </section>`;
      document.querySelector("#category-filter").onchange=event=>{category=event.target.value;render()};
      document.querySelector("#status-filter").onchange=event=>{status=event.target.value;render()};
      document.querySelector("#search").oninput=event=>{query=event.target.value;render();const input=document.querySelector("#search");input.focus();input.setSelectionRange(input.value.length,input.value.length)};
      document.querySelector("#add").onclick=()=>edit();
      content.querySelectorAll("[data-edit]").forEach(button=>button.onclick=()=>edit(button.dataset.edit));
      content.querySelectorAll("[data-toggle]").forEach(button=>button.onclick=()=>toggle(button.dataset.toggle));
      content.querySelectorAll("[data-delete]").forEach(button=>button.onclick=()=>remove(button.dataset.delete));
    }
    function row(item){const percent=item.total?Math.round(item.available/item.total*100):0,code=typeof item.id==="number"?String(item.id).padStart(3,"0"):item.id;return `<tr><td><div class="item-name">${esc(item.name)}</div><div class="item-sub">Mã TB-${esc(code)}</div></td><td>${esc(item.category)}</td><td><div class="quantity"><div class="track"><div class="fill" style="width:${percent}%"></div></div><span>${item.available} / ${item.total}</span></div></td><td>${esc(item.location)}</td><td><button class="status ${item.status==="ready"?"status-ready":"status-maintenance"}" data-toggle="${esc(item.id)}" aria-label="Đổi trạng thái ${esc(item.name)}">${item.status==="ready"?"Sẵn sàng":"Bảo trì"}</button>${item.booked?'<div class="item-sub">Đang được đặt</div>':''}</td><td><div class="actions"><button class="icon-button" data-edit="${esc(item.id)}" aria-label="Sửa ${esc(item.name)}">${icon("edit")}</button><button class="icon-button" data-delete="${esc(item.id)}" aria-label="Xóa ${esc(item.name)}">${icon("trash")}</button></div></td></tr>`}
    function modal(markup){overlay.innerHTML=`<div class="backdrop" data-backdrop><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">${markup}</section></div>`;overlay.querySelector("[data-backdrop]").onclick=event=>{if(event.target===event.currentTarget)close()};overlay.querySelectorAll("[data-close]").forEach(button=>button.onclick=close);overlay.querySelector("input,button,select")?.focus()}
    function close(){overlay.innerHTML=""}
    async function edit(id){
      let existing=items.find(item=>String(item.id)===String(id));if(id){try{existing=normalize(await request(`/${encodeURIComponent(id)}`))}catch(error){return showError(error)}}const item=existing||{name:"",category:"Trình chiếu",location:"Kho thiết bị · Tầng 1",total:1,available:1,status:"ready"};
      modal(`<h2 id="modal-title">${existing?"Cập nhật thiết bị":"Thêm thiết bị"}</h2><p class="copy">Thông tin này sẽ hiển thị cho nhân viên khi đặt phòng.</p><form class="form" id="item-form"><div class="field"><label for="name">Tên thiết bị <span style="color:#bd4c4c">*</span></label><input class="control" id="name" name="name" value="${esc(item.name)}" placeholder="Ví dụ: Máy chiếu Epson" maxlength="80" required></div><div class="form-grid"><div class="field"><label for="category">Danh mục</label><select class="control" id="category" name="category">${["Trình chiếu","Màn hình","Hỗ trợ họp","Âm thanh","Khác"].map(value=>`<option ${item.category===value?"selected":""}>${value}</option>`).join("")}</select></div><div class="field"><label for="location">Vị trí</label><input class="control" id="location" name="location" value="${esc(item.location)}" maxlength="80" required></div></div><div class="form-grid"><div class="field"><label for="total">Tổng số lượng</label><input class="control" id="total" name="total" type="number" min="1" value="${item.total}" required></div><div class="field"><label for="available">Số lượng sẵn có</label><input class="control" id="available" name="available" type="number" min="0" max="${item.total}" value="${item.available}" required></div></div><div class="modal-actions"><button type="button" class="button" data-close>Đóng</button><button class="button button-primary">${existing?"Lưu thay đổi":"Thêm thiết bị"}</button></div></form>`);
      document.querySelector("#total").oninput=event=>document.querySelector("#available").max=event.target.value;
      document.querySelector("#item-form").onsubmit=async event=>{event.preventDefault();const form=event.currentTarget;if(!form.reportValidity())return;const values=Object.fromEntries(new FormData(form).entries()),total=Number(values.total),count=Number(values.available);if(count>total)return notify("Số lượng sẵn có không thể lớn hơn tổng số lượng.",true);const body={...values,total,available:count,status:item.status||"ready"};try{await request(existing?`/${encodeURIComponent(existing.id)}`:"",{method:existing?"PUT":"POST",body:JSON.stringify(body)});close();await refresh();notify(existing?"Đã cập nhật thiết bị.":"Đã thêm thiết bị vào danh mục.")}catch(error){showError(error)}};
    }
    async function toggle(id){const item=items.find(entry=>String(entry.id)===String(id));if(!item)return;const updated={...item,status:item.status==="ready"?"maintenance":"ready"};try{await request(`/${encodeURIComponent(id)}`,{method:"PUT",body:JSON.stringify(payload(updated))});await refresh();notify(`${item.name}: ${updated.status==="ready"?"sẵn sàng sử dụng":"đang bảo trì"}.`)}catch(error){showError(error)}}
    function remove(id){const item=items.find(entry=>String(entry.id)===String(id));if(!item)return;modal(`<h2 id="modal-title">Xóa thiết bị?</h2><p class="copy">“${esc(item.name)}” sẽ bị xóa khỏi danh mục và không còn xuất hiện khi đặt phòng.</p><div class="modal-actions"><button class="button" data-close>Đóng</button><button class="button button-danger" id="confirm-delete">Xóa thiết bị</button></div>`);document.querySelector("#confirm-delete").onclick=async()=>{try{if(isBooked(await request(`/${encodeURIComponent(id)}/booked`)))return notify("Không thể xóa thiết bị đang được đặt.",true);await request(`/${encodeURIComponent(id)}`,{method:"DELETE"});close();await refresh();notify("Đã xóa thiết bị khỏi danh mục.")}catch(error){showError(error)}}}
    document.querySelector("#global-search").oninput=event=>{query=event.target.value;render();document.querySelector("#search").value=query};
    refresh().catch(showError);
  </script>
</body>
</html>
