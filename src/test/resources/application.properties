# ===================================================================
# TEST ENVIRONMENT ONLY - H2 In-Memory Database
# NEVER used in production or applied to real MySQL database
# ===================================================================
spring.application.name=meetingmanagement-test
server.port=8080

# In-memory H2 database for test execution
spring.datasource.url=jdbc:h2:mem:meetingdb;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# DDL auto enabled ONLY for in-memory H2 tests, never applied to real MySQL
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

# Test profile
spring.profiles.active=test

# JWT Configuration in test environment (Read from environment variables)
app.jwt.secret=${JWT_SECRET:}
app.jwt.issuer=${JWT_ISSUER:meeting-management}
app.jwt.audience=${JWT_AUDIENCE:meeting-management-client}
app.jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:86400}

# Mobile JWT Test Configuration (Read from environment variables)
app.mobile.jwt.secret=${MOBILE_JWT_SECRET:}
app.mobile.jwt.issuer=${MOBILE_JWT_ISSUER:meeting-management-mobile}
app.mobile.jwt.audience=${MOBILE_JWT_AUDIENCE:mobile-app}

# Mail Configuration
spring.mail.host=localhost
spring.mail.port=1025
