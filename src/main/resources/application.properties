spring.application.name=meetingmanagement
server.port=8080
# MySQL
spring.datasource.url=${DB_URL:jdbc:mysql://127.0.0.1:3306/meeting_management?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Khong tu dong thay doi database
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# H2 Console (khi can debug)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

