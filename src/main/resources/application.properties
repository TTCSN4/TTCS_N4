spring.application.name=meetingmanagement

spring.datasource.url=${MEETING_DB_URL:jdbc:mysql://127.0.0.1:3306/meeting_management?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${MEETING_DB_USERNAME:root}
spring.datasource.password=${MEETING_DB_PASSWORD:Root@123456}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

server.port=8081
