<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>US16 Email nhắc lịch</title><style>body{font:15px Arial;max-width:1050px;margin:32px auto;padding:0 16px;background:#f3f5f7;color:#1f2933}section{background:#fff;padding:20px;margin:15px 0;border-radius:10px;box-shadow:0 2px 8px #0001}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}input,select,button,textarea{padding:9px;border:1px solid #b8c1cc;border-radius:5px;box-sizing:border-box}button{background:#1769aa;color:white;border:0;cursor:pointer}.danger{background:#b42318}pre{white-space:pre-wrap;background:#eaf0f4;padding:14px;min-height:50px}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head><body><h1>US16 Thông báo email lịch họp</h1><p>Tạo cuộc họp, mời người tham dự, đổi hoặc hủy lịch. Nhấn “Quét ngay” để gửi các email đã đến hạn mà không phải chờ scheduler.</p>
<section><h2>1. Tạo cuộc họp và mời người tham dự</h2><div class="grid"><input id="title" value="Họp nhóm dự án" placeholder="Tiêu đề"><input id="organizerId" value="user-001" placeholder="Mã người tổ chức"><input id="organizerName" value="Nguyễn Văn A" placeholder="Tên người tổ chức"><input id="organizerEmail" value="organizer@example.com" placeholder="Email người tổ chức"><input id="start" type="datetime-local"><input id="end" type="datetime-local"><input id="location" value="Phòng A101" placeholder="Phòng họp"><input id="detailUrl" value="http://localhost:8080" placeholder="Đường dẫn chi tiết"><input id="participantId" value="user-002" placeholder="Mã người tham dự"><input id="participantName" value="Trần Văn B" placeholder="Tên người tham dự"><input id="participantEmail" value="participant@example.com" placeholder="Email người tham dự"><select id="accountActive"><option value="true">Tài khoản hoạt động</option><option value="false">Tài khoản vô hiệu hóa</option></select></div><button onclick="createMeeting()">Tạo cuộc họp</button></section>
<section><h2>2. Quản lý lịch</h2><div class="grid"><input id="meetingId" placeholder="Mã cuộc họp"><input id="userId" value="user-002" placeholder="Mã người tham dự"><select id="participantStatus"><option>ACCEPTED</option><option>DECLINED</option><option>REMOVED</option><option>INVITED</option></select><button onclick="changeStatus()">Cập nhật người tham dự</button><input id="newStart" type="datetime-local"><input id="newEnd" type="datetime-local"><input id="newLocation" value="Phòng B202" placeholder="Địa điểm mới"><button onclick="updateMeeting()">Đổi lịch</button></div><button class="danger" onclick="cancelMeeting()">Hủy cuộc họp</button></section>
<section><h2>3. Email và lịch sử</h2><button onclick="dispatch()">Quét và gửi ngay</button> <button onclick="history()">Xem lịch sử notification</button></section><pre id="out">Kết quả sẽ hiển thị ở đây.</pre>
<script>const q=id=>document.getElementById(id),out=q('out');async function call(url,opts={}){let r=await fetch(url,{headers:{'Content-Type':'application/json'},...opts});let t=await r.text();out.textContent=(r.status+' '+r.statusText+'\n'+t);if(!r.ok)return null;try{return JSON.parse(t)}catch{return t}}function iso(id){return new Date(q(id).value).toISOString()}async function createMeeting(){let participants=q('participantEmail').value?[{userId:q('participantId').value,fullName:q('participantName').value,email:q('participantEmail').value,accountActive:q('accountActive').value==='true'}]:[];let x=await call('/api/meetings',{method:'POST',body:JSON.stringify({title:q('title').value,description:'Kiểm thử US16',startTime:iso('start'),endTime:iso('end'),organizerId:q('organizerId').value,organizerName:q('organizerName').value,organizerEmail:q('organizerEmail').value,location:q('location').value,detailUrl:q('detailUrl').value,participants})});if(x)q('meetingId').value=x.id}function changeStatus(){return call('/api/meetings/'+q('meetingId').value+'/participants/'+q('userId').value+'/'+q('participantStatus').value,{method:'PATCH'})}function updateMeeting(){return call('/api/meetings/'+q('meetingId').value,{method:'PUT',body:JSON.stringify({startTime:iso('newStart'),endTime:iso('newEnd'),location:q('newLocation').value})})}function cancelMeeting(){return call('/api/meetings/'+q('meetingId').value+'/cancel',{method:'POST'})}function dispatch(){return call('/api/reminders/dispatch',{method:'POST'})}function history(){return call('/api/meetings/'+q('meetingId').value+'/reminders')}</script></body></html>
