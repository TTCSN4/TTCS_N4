# Ket noi MySQL database cu
spring.datasource.url=${DB_URL:jdbc:mysql://127.0.0.1:3306/meeting_management?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true}

# Tai khoan MySQL
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# MySQL JDBC Driver
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Kiem tra schema, khong tu dong sua database
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Hien thi SQL khi debug
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Backend port
server.port=8080
