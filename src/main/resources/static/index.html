<!doctype html>
<html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quản lý lịch họp</title><link rel="stylesheet" href="/styles.css"></head>
<body><main class="app-shell">
<header class="topbar"><div class="brand"><svg viewBox="0 0 24 24"><path d="M7 2v2h10V2h2v2h3v18H2V4h3V2h2Zm13 8H4v10h16V10ZM7 13h4v4H7v-4Z"/></svg><h1>QUẢN LÝ LỊCH HỌP</h1></div><div class="account"><button class="icon-button notification" aria-label="Thông báo"><svg viewBox="0 0 24 24"><path d="M12 22a2.5 2.5 0 0 0 2.45-2h-4.9A2.5 2.5 0 0 0 12 22Zm7-5-2-2v-5a5 5 0 0 0-4-4.9V4a1 1 0 0 0-2 0v1.1A5 5 0 0 0 7 10v5l-2 2v1h14v-1Z"/></svg><i></i></button><span class="avatar"><svg viewBox="0 0 24 24"><path d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8Zm-7 9a7 7 0 0 1 14 0H5Z"/></svg></span><span class="account-name">Thùy Linh</span><svg class="chevron" viewBox="0 0 24 24"><path d="m7 9 5 5 5-5 1.4 1.4L12 16.8l-6.4-6.4L7 9Z"/></svg></div></header>
<section class="workspace"><div id="message" class="message" role="status"></div><div class="table-wrap"><table><thead><tr><th>ID</th><th>Tên cuộc họp</th><th>Người tổ chức</th><th>Ngày</th><th>Phòng</th><th>Status</th></tr></thead><tbody id="meetingRows"><tr><td colspan="6" class="empty">Đang tải dữ liệu...</td></tr></tbody></table></div>
<section class="edit-panel"><label class="field"><span>Tên mới:</span><input id="newTitle" maxlength="255" placeholder="Chọn một cuộc họp để chỉnh sửa"></label><input id="userId" type="hidden"><div class="actions"><button id="editButton" class="button primary" disabled><svg viewBox="0 0 24 24"><path d="M4 17.3V21h3.7L18.6 10.1l-3.7-3.7L4 17.3ZM21.4 7.3a1 1 0 0 0 0-1.4l-2.3-2.3a1 1 0 0 0-1.4 0l-1.8 1.8 3.7 3.7 1.8-1.8Z"/></svg>SỬA LỊCH</button><button id="cancelButton" class="button danger" disabled><svg viewBox="0 0 24 24"><path d="M7 21a2 2 0 0 1-2-2V6h14v13a2 2 0 0 1-2 2H7ZM9 9v8h2V9H9Zm4 0v8h2V9h-2ZM4 3h5l1-1h4l1 1h5v2H4V3Z"/></svg>HỦY CUỘC HỌP</button></div></section></section></main>
<dialog id="confirmDialog"><h2>Xác nhận hủy cuộc họp</h2><p id="confirmText"></p><div class="dialog-actions"><button id="closeDialogButton" class="button secondary">Quay lại</button><button id="confirmCancelButton" class="button danger">Xác nhận hủy</button></div></dialog><script src="/app.js"></script></body></html>
