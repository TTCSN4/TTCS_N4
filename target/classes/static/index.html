<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Trợ lý đặt phòng họp</title>
  <style>
    *{box-sizing:border-box}body{margin:0;font:15px system-ui,Segoe UI,sans-serif;background:#eef3f8;color:#182230}.app{max-width:900px;height:100vh;margin:auto;display:flex;flex-direction:column;background:#fff;box-shadow:0 0 30px #b8c3cf55}.head{padding:18px 22px;background:#075985;color:#fff;display:flex;align-items:center;gap:12px}.avatar{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:#e0f2fe;color:#075985;font-size:22px}.head h1{font-size:18px;margin:0}.head p{margin:3px 0 0;color:#bae6fd;font-size:13px}.messages{flex:1;overflow:auto;padding:24px;background:linear-gradient(#f8fafc,#eef6fb)}.row{display:flex;margin:10px 0}.row.user{justify-content:flex-end}.bubble{max-width:75%;padding:11px 14px;border-radius:16px;line-height:1.45;white-space:pre-wrap;box-shadow:0 1px 2px #0001}.bot .bubble{background:#fff;border-bottom-left-radius:4px}.user .bubble{background:#0284c7;color:#fff;border-bottom-right-radius:4px}.booking{margin-top:8px;padding:10px;border-radius:10px;background:#ecfdf5;color:#166534;font-size:13px}.quick{display:flex;gap:8px;padding:0 18px 12px;overflow:auto}.quick button{white-space:nowrap;border:1px solid #7dd3fc;background:#f0f9ff;color:#0369a1;border-radius:18px;padding:7px 12px;cursor:pointer}.composer{display:flex;gap:10px;padding:15px 18px;border-top:1px solid #dbe4ec}.composer input{flex:1;border:1px solid #b9c6d2;border-radius:22px;padding:11px 15px;font-size:15px}.composer button{border:0;border-radius:22px;padding:0 22px;background:#0284c7;color:#fff;font-weight:600;cursor:pointer}.composer button:disabled{opacity:.5}.rooms{display:grid;gap:7px;margin-top:10px}.room{border:1px solid #bae6fd;background:#f0f9ff;color:#075985;border-radius:10px;padding:9px;text-align:left;cursor:pointer}.room b{display:block}.room small{color:#475569}.note{text-align:center;padding:7px;color:#64748b;font-size:12px}@media(max-width:600px){.bubble{max-width:88%}.app{height:100dvh}.messages{padding:15px}}
  </style>
</head>
<body><main class="app">
  <header class="head"><div class="avatar">💬</div><div><h1>Trợ lý đặt phòng họp</h1><p>Kiểm tra phòng trống và tạo lịch trực tiếp trong cuộc trò chuyện</p></div></header>
  <section id="messages" class="messages"></section>
  <div id="quick" class="quick"></div>
  <form id="form" class="composer"><input id="message" autocomplete="off" placeholder="Nhập câu trả lời..."><button id="send">Gửi</button></form>
  <div class="note">Gõ “làm lại” bất cứ lúc nào để bắt đầu yêu cầu mới</div>
</main>
<script>
let sessionId=null,step='ORGANIZER',roomOptions=[];const messages=document.getElementById('messages'),input=document.getElementById('message'),send=document.getElementById('send'),quick=document.getElementById('quick');
function bubble(text,type='bot',booking=null,options=[]){const row=document.createElement('div');row.className='row '+type;const box=document.createElement('div');box.className='bubble';box.textContent=text;if(options.length){const list=document.createElement('div');list.className='rooms';for(const room of options){const button=document.createElement('button');button.className='room';button.innerHTML=`<b>${room.name} (${room.id})</b><small>${room.capacity} người · ${room.location||'Chưa có vị trí'}</small>`;button.onclick=()=>submit(room.id);list.appendChild(button)}box.appendChild(list)}if(booking){const card=document.createElement('div');card.className='booking';card.textContent=`✓ ${booking.roomName} · ${new Date(booking.startTime).toLocaleString('vi-VN')} · Mã ${booking.meetingId}`;box.appendChild(card)}row.appendChild(box);messages.appendChild(row);messages.scrollTop=messages.scrollHeight}
function actions(){quick.innerHTML='';const choices=step==='ROOM'?['tự chọn',...roomOptions.map(room=>room.id)]:step==='PARTICIPANTS'?['không']:step==='CONFIRM'?['xác nhận','làm lại']:step==='DONE'?['làm lại']:[];for(const value of [...new Set(choices)]){const button=document.createElement('button');button.textContent=value;button.onclick=()=>submit(value);quick.appendChild(button)}}
async function submit(value){const text=(value??input.value).trim();if(!text)return;bubble(text,'user');input.value='';send.disabled=true;try{const response=await fetch('/api/chatbot/message',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({sessionId,message:text})});const data=await response.json();sessionId=data.sessionId;step=data.step;roomOptions=data.roomOptions||[];bubble(data.reply,'bot',data.booking,roomOptions);actions()}catch(e){bubble('Không thể kết nối tới trợ lý. Hãy kiểm tra backend và thử lại.')}finally{send.disabled=false;input.focus()}}
document.getElementById('form').addEventListener('submit',e=>{e.preventDefault();submit()});
bubble('Xin chào! Bạn có thể mô tả toàn bộ yêu cầu, ví dụ: “Tôi là user-001, đặt phòng cho 8 người lúc 14:00 ngày mai trong 1 tiếng”. Nếu chưa cấu hình AI, hãy nhập mã người tổ chức để dùng chế độ hỏi từng bước.');actions();input.focus();
</script></body></html>
