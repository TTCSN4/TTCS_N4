# Ket noi MySQL database cu
spring.datasource.url=${DB_URL:jdbc:mysql://127.0.0.1:3306/meeting_management?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true}

# Tai khoan MySQL
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# MySQL JDBC Driver
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Kiem tra schema, khong tu dong sua database
spring.jpa.hibernate.ddl-auto=validate

# Hien thi SQL khi debug
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Backend port
server.port=8080

# JWT Configuration
app.jwt.secret=${JWT_SECRET:}
app.jwt.issuer=${JWT_ISSUER:meeting-management}
app.jwt.audience=${JWT_AUDIENCE:meeting-management-client}
app.jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:86400}

# Mobile JWT Configuration
app.mobile.jwt.secret=${MOBILE_JWT_SECRET:}
app.mobile.jwt.issuer=${MOBILE_JWT_ISSUER:meeting-management-mobile}
app.mobile.jwt.audience=${MOBILE_JWT_AUDIENCE:mobile-app}
