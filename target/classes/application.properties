spring.application.name=us16-meeting-reminder
server.port=8080
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/meeting_management_us16?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jackson.time-zone=Asia/Ho_Chi_Minh
app.reminder.scan-ms=${REMINDER_SCAN_MS:60000}
app.reminder.max-retries=${REMINDER_MAX_RETRIES:3}
app.mail.from=${MAIL_FROM:no-reply@meeting.local}
spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:1025}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:false}
