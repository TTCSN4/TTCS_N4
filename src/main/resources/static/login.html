<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Đăng nhập · Meeting</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#edf4fc;font:15px system-ui;color:#18334f}main{width:min(100%,420px);background:white;border:1px solid #dae5f2;border-radius:18px;padding:32px;box-shadow:0 15px 60px #18334f12}h1{margin:0;color:#0964eb}h2{margin-top:28px}label{display:block;margin-top:18px;font-weight:600}input{width:100%;padding:12px;margin-top:8px;border:1px solid #bccde1;border-radius:8px;font:inherit}button{width:100%;margin-top:24px;background:#0765f5;color:white;border:0;border-radius:8px;padding:13px;font:inherit;font-weight:600;cursor:pointer}button:disabled{opacity:.6}#error{color:#b42318}small{display:block;color:#60778e;line-height:1.6;margin-top:16px}</style></head><body><main><h1>Meeting</h1><p>Meeting Management</p><h2>Đăng nhập</h2><form id="login"><label for="username">Tên đăng nhập</label><input id="username" name="username" autocomplete="username" required maxlength="100"><label for="password">Mật khẩu</label><input id="password" name="password" type="password" autocomplete="current-password" required maxlength="128"><p id="error" role="alert" hidden></p><button id="submit">Đăng nhập</button></form><small>Tài khoản: admin, pm hoặc member. Mật khẩu khởi tạo hiện trong cửa sổ chạy máy chủ lần đầu. Tài khoản mới có thể đăng nhập bằng email.</small></main><script>document.getElementById('login').onsubmit=async e=>{e.preventDefault();const button=document.getElementById('submit'),error=document.getElementById('error');button.disabled=true;error.hidden=true;try{const r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:document.getElementById('username').value,password:document.getElementById('password').value})});const data=await r.json();if(!r.ok)throw Error(data.message);location.href=data.user.role==='MEMBER'?'/#us17':'/#us01'}catch(e){error.textContent=e.message;error.hidden=false}finally{button.disabled=false}};</script></body></html>
