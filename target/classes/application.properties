spring.application.name=us28-hrm-erp-integration
server.port=8080
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/meeting_management?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
integration.hrm.enabled=${HRM_INTEGRATION_ENABLED:false}
integration.hrm.provider=${HRM_PROVIDER:HRM-ERP}
integration.hrm.base-url=${HRM_BASE_URL:http://localhost:8098}
integration.hrm.snapshot-path=${HRM_SNAPSHOT_PATH:/api/v1/workforce/snapshot}
integration.hrm.api-key=${HRM_API_KEY:}
integration.hrm.webhook-key=${HRM_WEBHOOK_KEY:}
integration.hrm.connect-timeout-ms=${HRM_CONNECT_TIMEOUT_MS:5000}
integration.hrm.read-timeout-ms=${HRM_READ_TIMEOUT_MS:30000}
integration.hrm.sync-interval-ms=${HRM_SYNC_INTERVAL_MS:900000}
integration.hrm.initial-delay-ms=${HRM_INITIAL_DELAY_MS:30000}
