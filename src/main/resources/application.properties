spring.application.name=meetingmanagement
server.port=8080
spring.datasource.url=jdbc:h2:mem:meetingdb;MODE=MySQL;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JWT Configuration - Must be provided via environment variables in runtime
app.jwt.secret=${JWT_SECRET:}
app.jwt.issuer=${JWT_ISSUER:meeting-management}
app.jwt.audience=${JWT_AUDIENCE:meeting-management-client}
app.jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:86400}

# Mobile JWT Configuration - Must be provided via environment variables in runtime
app.mobile.jwt.secret=${MOBILE_JWT_SECRET:}
app.mobile.jwt.issuer=${MOBILE_JWT_ISSUER:meeting-management-mobile}
app.mobile.jwt.audience=${MOBILE_JWT_AUDIENCE:mobile-app}

# Mail Configuration
spring.mail.host=localhost
spring.mail.port=1025
