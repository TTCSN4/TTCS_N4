spring.application.name=meetingmanagement
server.port=8080
spring.datasource.url=jdbc:h2:mem:meetingdb;MODE=MySQL;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Local backend starts without external services.
app.mobile.jwt.enabled=false
spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:1025}
app.reminder.enabled=${REMINDER_ENABLED:false}
