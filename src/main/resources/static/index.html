<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>US28 Tích hợp HRM ERP</title>
<style>*{box-sizing:border-box}body{margin:0;background:#eef3f8;color:#172033;font:15px system-ui,Segoe UI,sans-serif}.wrap{max-width:1050px;margin:36px auto;padding:0 18px}.head,.card{background:#fff;border-radius:12px;padding:22px;margin-bottom:16px;box-shadow:0 3px 16px #17203312}.head{background:#075985;color:#fff}.head h1{margin:0 0 5px}.head p{margin:0;color:#bae6fd}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.metric{background:#f8fafc;border:1px solid #dbe5ef;border-radius:9px;padding:15px}.label{color:#64748b;font-size:13px}.value{font-size:20px;font-weight:700;margin-top:5px}.ok{color:#15803d}.bad{color:#b91c1c}button{border:0;background:#0284c7;color:white;border-radius:7px;padding:10px 16px;font-weight:600;cursor:pointer}button:disabled{opacity:.5}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:9px;border-bottom:1px solid #e2e8f0}th{color:#475569;font-size:13px}pre{white-space:pre-wrap;background:#f8fafc;padding:12px;border-radius:7px}@media(max-width:700px){.grid{grid-template-columns:1fr}table{font-size:12px}}</style></head>
<body><main class="wrap"><section class="head"><h1>Tích hợp HRM ERP</h1><p>Theo dõi trạng thái kết nối, đồng bộ nhân viên và phòng ban từ hệ thống nguồn.</p></section>
<section class="card"><div class="grid"><div class="metric"><div class="label">Nhà cung cấp</div><div class="value" id="provider">-</div></div><div class="metric"><div class="label">Trạng thái</div><div class="value" id="state">-</div></div><div class="metric"><div class="label">Lần thành công gần nhất</div><div class="value" id="last">-</div></div></div><p id="error" class="bad"></p><button id="pull" onclick="pullNow()">Đồng bộ ngay</button></section>
<section class="card"><h2>Lịch sử đồng bộ</h2><table><thead><tr><th>Thời điểm</th><th>Nguồn</th><th>Trạng thái</th><th>Phòng ban</th><th>Nhân viên</th><th>Vô hiệu hóa</th></tr></thead><tbody id="history"></tbody></table></section>
<section class="card"><h2>Kết quả gần nhất</h2><pre id="result">Chưa có thao tác trong phiên này.</pre></section></main>
<script>
const fmt=v=>v?new Date(v).toLocaleString('vi-VN'):'Chưa có';
async function json(url,options){const response=await fetch(url,options);const data=await response.json();if(!response.ok)throw new Error(data.message||'Yêu cầu thất bại');return data}
function renderHistory(runs){history.replaceChildren();if(!runs.length){const row=history.insertRow();const cell=row.insertCell();cell.colSpan=6;cell.textContent='Chưa có lần đồng bộ nào.';return}for(const run of runs){const row=history.insertRow();[fmt(run.startedAt),run.source,run.status,`+${run.departmentsCreated} / ~${run.departmentsUpdated}`,`+${run.usersCreated} / ~${run.usersUpdated}`,run.usersDeactivated].forEach(value=>{row.insertCell().textContent=value??''})}}
async function refresh(){try{const [status,runs]=await Promise.all([json('/api/integrations/hrm/status'),json('/api/integrations/hrm/history?limit=20')]);provider.textContent=status.provider+(status.enabled?' (đã bật)':' (đã tắt)');state.textContent=status.state;state.className='value '+(status.state==='SUCCESS'?'ok':status.state==='FAILED'?'bad':'');last.textContent=fmt(status.lastSuccessfulSync);error.textContent=status.lastError||'';renderHistory(runs)}catch(e){error.textContent=e.message}}
async function pullNow(){pull.disabled=true;result.textContent='Đang lấy snapshot từ HRM/ERP...';try{result.textContent=JSON.stringify(await json('/api/integrations/hrm/pull',{method:'POST'}),null,2)}catch(e){result.textContent=e.message}finally{pull.disabled=false;refresh()}}
refresh();setInterval(refresh,30000);
</script></body></html>
