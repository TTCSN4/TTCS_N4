spring.application.name=meetingmanagement
spring.config.import=optional:classpath:application-us02.properties,optional:classpath:application-us05.properties,optional:classpath:application-us12.properties,optional:classpath:application-us13.properties,optional:classpath:application-us16.properties,optional:classpath:application-us18.properties,optional:classpath:application-us25.properties,optional:classpath:application-us28.properties
server.port=8080
spring.datasource.url=jdbc:h2:mem:meetingdb;MODE=MySQL;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
