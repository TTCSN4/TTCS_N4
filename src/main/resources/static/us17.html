
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>US17 - Lịch họp Mobile</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f3f5f9;
            margin: 0;
            padding: 20px;
            color: #243247;
        }

        .container {
            max-width: 850px;
            margin: auto;
        }

        .panel {
            background: white;
            padding: 22px;
            border-radius: 12px;
            margin-bottom: 18px;
            box-shadow: 0 2px 10px #0000000c;
        }

        h1 {
            color: #185abd;
        }

        label {
            display: block;
            margin: 12px 0 6px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 11px;
            border: 1px solid #ccd5e0;
            border-radius: 7px;
        }

        .dates {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        button {
            background: #185abd;
            color: white;
            border: none;
            border-radius: 7px;
            padding: 12px 18px;
            cursor: pointer;
            margin-top: 14px;
        }

        button:hover {
            background: #10448e;
        }

        .meeting {
            display: block;
            width: 100%;
            text-align: left;
            background: #f5f8fd;
            color: #243247;
            padding: 16px;
            margin: 10px 0;
            border: 1px solid #dce5f0;
        }

        .meeting:hover {
            background: #e8f1ff;
        }

        .meeting strong {
            display: block;
            margin-bottom: 8px;
        }

        .error {
            color: #c62828;
        }

        pre {
            white-space: pre-wrap;
            overflow-wrap: anywhere;
        }

        @media (max-width: 600px) {
            .dates {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>
<div class="container">

    <div class="panel">
        <h1>Lịch họp của tôi</h1>
        <p>US17 - Mobile Meeting Calendar</p>

        <div class="dates">
            <div>
                <label>Từ ngày</label>
                <input
                    type="date"
                    id="from"
                    value="2026-10-01"
                >
            </div>

            <div>
                <label>Đến ngày</label>
                <input
                    type="date"
                    id="to"
                    value="2026-10-31"
                >
            </div>
        </div>

        <button onclick="loadCalendar()">
            Xem lịch họp
        </button>

        <p id="message"></p>
    </div>

    <div class="panel">
        <h2>Danh sách cuộc họp</h2>
        <p id="total">Chưa tải dữ liệu</p>
        <div id="meetings"></div>
    </div>

    <div class="panel">
        <h2>Chi tiết cuộc họp</h2>
        <pre id="detail">Chọn cuộc họp để xem.</pre>
    </div>

</div>

<script>
    const $ = id => document.getElementById(id);

    async function apiGet(url) {
        const token = sessionStorage.getItem("us17_access_token") || "";

        if (!/^[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+$/.test(token)) {
            throw new Error("Bạn chưa đăng nhập hoặc token không hợp lệ.");
        }

        const response = await fetch(url, {
            method: "GET",
            headers: {
                "Authorization": "Bearer " + token
            }
        });

        if (!response.ok) {
            throw new Error(
                "HTTP " + response.status +
                (response.status === 401
                    ? " - JWT sai hoặc hết hạn"
                    : " - Không thể lấy dữ liệu")
            );
        }

        return response.json();
    }

    async function loadCalendar() {
        const list = $("meetings");

        list.replaceChildren();
        $("detail").textContent = "Chọn cuộc họp để xem.";
        $("total").textContent = "Đang tải...";
        $("message").textContent = "";

        const from = $("from").value;
        const to = $("to").value;

        if (!from || !to || from > to) {
            $("message").textContent =
                "Khoảng ngày không hợp lệ.";
            $("message").className = "error";
            return;
        }

        const url =
            "/api/mobile/calendar?from=" +
            encodeURIComponent(from) +
            "&to=" + encodeURIComponent(to) +
            "&page=0&size=50";

        try {
            const data = await apiGet(url);

            $("total").textContent =
                "Tổng số cuộc họp: " + data.totalElements;

            if (data.content.length === 0) {
                list.textContent = "Không có cuộc họp.";
                return;
            }

            data.content.forEach(meeting => {
                const button = document.createElement("button");
                button.className = "meeting";

                const name = document.createElement("strong");
                name.textContent = meeting.title;

                const time = document.createElement("span");
                time.textContent =
                    meeting.startTime + " → " +
                    meeting.endTime;

                const room = document.createElement("p");
                room.textContent =
                    "Phòng: " + (meeting.roomName || "Chưa có");

                button.append(name, time, room);

                button.onclick = () =>
                    loadDetail(meeting.meetingId);

                list.appendChild(button);
            });

        } catch (error) {
            $("total").textContent = "Không tải được lịch họp.";
            $("message").className = "error";
            $("message").textContent = error.message;
        }
    }

    async function loadDetail(meetingId) {
        $("detail").textContent = "Đang tải chi tiết...";

        try {
            const data = await apiGet(
                "/api/mobile/calendar/" +
                encodeURIComponent(meetingId)
            );

            $("detail").textContent =
                "Tên cuộc họp: " + data.title + "\n" +
                "Mô tả: " + (data.description || "") + "\n" +
                "Bắt đầu: " + data.startTime + "\n" +
                "Kết thúc: " + data.endTime + "\n" +
                "Phòng: " + (data.roomName || "") + "\n" +
                "Trạng thái: " + data.status;

        } catch (error) {
            $("detail").textContent = error.message;
        }
    }
</script>
</body>
</html>
