
# US27 - Ket noi database MySQL cu
spring.datasource.url=${DB_URL:jdbc:mysql://127.0.0.1:3306/meeting_management?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true}

# Tai khoan MySQL
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# MySQL JDBC Driver
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Chi kiem tra Entity voi database, khong sua bang
spring.jpa.hibernate.ddl-auto=validate

# Hien thi SQL khi debug
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Chay backend tren localhost:8080
server.port=8080
